<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apeiron Tenerife Center of Excellence - Virtual Reception</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Microsoft Cognitive Services Speech SDK -->
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>

</head>
<body>

    <!-- Landing Screen -->
<div id="landingScreen" class="landing-container">
    <div class="landing-card">
      <div class="icon-wrapper">
        <!-- MessageCircle Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>
      </div>
  
      <h1 class="landing-title">
        Welcome to Apeiron Tenerife – Center of Excellence Reception
        <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-sparkles">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/>
        <path d="M4 17v2"/><path d="M5 18H3"/>
   </svg>
      </h1>

      

      <!-- Landing Avatar (auto-welcome) placed below the description -->
      <div id="landingAvatarContainer" class="avatar-container landing-avatar">
        <video id="landingAvatarVideo" class="avatar-video" autoplay muted playsinline></video>
        <audio id="landingAvatarAudio" autoplay preload="auto" volume="1.0"></audio>
        <div id="landingAvatarStatus" class="avatar-status">Getting ready...</div>
      </div>
  
      <button class="start-chat-btn">
        Start Check-in
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>
  



  <!-- Main Screen -->
  <div id="chatScreen" class="main-container hidden">
    <!-- Full width Chat Container -->
    <div class="chat-side-full">
      <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
          <span>&larr;</span> Apeiron Tenerife Center of Excellence Reception
        </div>
    
        <!-- Avatar Video Container -->
        <div id="avatarContainer" class="avatar-container hidden">
          <video id="avatarVideo" class="avatar-video" autoplay></video>
          <audio id="avatarAudio" autoplay preload="auto" volume="1.0"></audio>
          <div id="avatarStatus" class="avatar-status">Connecting to avatar...</div>
        </div>

        <!-- Messages Area -->
        <div id="chatMessages" class="chat-messages">
          <!-- Messages will be dynamically injected here -->
        </div>
       
        <!-- Footer Controls -->
        <div class="chat-footer">
          <!-- Toggle Voice/Text Mode -->
          <button id="modeToggleBtn" class="mode-toggle">
            <span id="modeIcon">
              <!-- Icon will be injected here -->
            </span>        
            <span id="modeLabel">Voice Mode</span>
          </button>
    
          <!-- Text Input -->
          <div id="textInputSection" class="input-section hidden">
            <input id="userInput" type="text" placeholder="Type your message..." />
            <button id="sendBtn" class="send-btn" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send">
                <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
                <path d="m21.854 2.147-10.94 10.939"/>
              </svg>
            </button>
          </div>
    
          <!-- Voice Status Area -->
          <div id="voiceStatus" class="status-section">
            <div id="recordingStatus" class="status-item hidden">
              <div class="pulse-icon"></div>
              <span>AI is listening...</span>
            </div>
            <div id="speakingStatus" class="status-item">
              <span>AI is listening...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Check-in Form (Hidden initially) -->
      <div id="checkinForm" class="checkin-form hidden">
        <div class="form-card">
          <div class="form-header">
            <h2>Visitor Registration</h2>
            <p>Please complete your information for check-in</p>
          </div>
          
          <form id="visitorForm" class="visitor-form">
            <div class="form-row">
              <div class="form-group">
                <label for="visitorName">Full Name</label>
                <input type="text" id="visitorName" name="name" required>
              </div>
              <div class="form-group">
                <label for="visitorCompany">Company</label>
                <input type="text" id="visitorCompany" name="company" required>
              </div>
            </div>
            
            <div class="form-row">
              <div class="form-group">
                <label for="visitReason">Reason for Visit</label>
                <select id="visitReason" name="reason" required>
                  <option value="">Select an option</option>
                  <option value="meeting">Meeting</option>
                  <option value="interview">Interview</option>
                  <option value="delivery">Document Delivery</option>
                  <option value="training">Training</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="personToVisit">Person to Visit</label>
                <input type="text" id="personToVisit" name="personToVisit" required>
              </div>
            </div>
            
            <div class="form-group">
              <label for="visitorEmail">Email (Optional)</label>
              <input type="email" id="visitorEmail" name="email">
            </div>

            <!-- Photo Capture Section -->
            <div class="photo-section">
              <label>Photograph</label>
              <div id="cameraContainer" class="camera-container">
                <video id="cameraVideo" class="camera-video" autoplay></video>
                <canvas id="photoCanvas" class="photo-canvas hidden"></canvas>
                <div id="photoPreview" class="photo-preview hidden">
                  <img id="capturedPhoto" alt="Captured photo">
                </div>
              </div>
              <div class="camera-controls">
                <button type="button" id="startCamera" class="camera-btn">
                  📷 Start Camera
                </button>
                <button type="button" id="takePhoto" class="camera-btn hidden">
                  📸 Take Photo
                </button>
                <button type="button" id="retakePhoto" class="camera-btn hidden">
                  🔄 Retake Photo
                </button>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
              <button type="button" id="cancelForm" class="btn-secondary">
                Cancel
              </button>
              <button type="submit" id="submitForm" class="btn-primary" disabled>
                Complete Check-in
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  
  

  <script src="{{ url_for('static', filename='js/avatar.js') }}"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
